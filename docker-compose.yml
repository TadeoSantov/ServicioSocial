version: "3.9"

services:
  ai-service:
    build: ./ai-service
    container_name: evaluador-ai-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: evaluador-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - AI_SERVICE_URL=http://ai-service:8000
      - PORT=8080
      - ENV=production
      - CORS_ORIGINS=http://localhost:3000
    depends_on:
      - ai-service
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: evaluador-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend
    restart: unless-stopped
